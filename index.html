<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Newsletters">
<meta name="robots" content="noindex, nofollow">
<title>Newsletter Archive</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232a78d6'/><rect x='7' y='9' width='18' height='2.6' rx='1.3' fill='white'/><rect x='7' y='15' width='18' height='2.6' rx='1.3' fill='white' opacity='.75'/><rect x='7' y='21' width='11' height='2.6' rx='1.3' fill='white' opacity='.5'/></svg>">
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f9f9f7; --raised:#ffffff;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --seq-4:#3987e5; --accent:#2a78d6; --shadow:rgba(11,11,11,.18);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d; --raised:#212120;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --seq-4:#3987e5; --accent:#3987e5; --shadow:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior-y:none}
body{
  background:var(--plane); color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}

.app{display:flex;flex-direction:column;height:100dvh}
header{
  padding:calc(12px + env(safe-area-inset-top)) 20px 11px;background:var(--surface-1);
  border-bottom:1px solid var(--grid);flex:0 0 auto;
}
.hrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.sub{color:var(--muted);font-size:12.5px}
.spacer{flex:1}
.iconbtn{
  background:transparent;border:1px solid var(--ring);border-radius:8px;
  padding:6px 11px;cursor:pointer;color:var(--ink-2);font-size:12.5px;white-space:nowrap;
}
.iconbtn:hover{background:var(--plane)}
.iconbtn .badge[hidden]{display:none}
.iconbtn .badge{
  display:inline-block;min-width:16px;padding:0 4px;margin-left:5px;border-radius:8px;
  background:var(--accent);color:#fff;font-size:10.5px;line-height:16px;text-align:center;font-weight:600;
}

.tiles{display:flex;gap:20px;margin-top:10px;align-items:flex-end;overflow-x:auto;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto}
.tile .v{font-size:20px;font-weight:640;letter-spacing:-.02em;line-height:1.15}
.tile .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:1px;white-space:nowrap}
#spark{margin-left:auto;flex:0 0 auto}
#spark svg{display:block}

main{flex:1;display:flex;min-height:0}
aside{
  width:262px;flex:0 0 262px;background:var(--surface-1);
  border-right:1px solid var(--grid);display:flex;flex-direction:column;min-height:0;
}
#facetlist{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 14px calc(30px + env(safe-area-inset-bottom));
}
section.results{flex:1;min-width:0;display:flex;flex-direction:column}

.searchbar{
  display:flex;gap:8px;padding:10px 20px;border-bottom:1px solid var(--grid);
  background:var(--surface-1);align-items:center;
}
#q{
  flex:1;min-width:0;padding:9px 12px;border-radius:9px;
  border:1px solid var(--ring);background:var(--plane);
}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
select{padding:8px 9px;border-radius:9px;border:1px solid var(--ring);background:var(--plane);max-width:42vw}
.count{color:var(--muted);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}

.fgroup{margin-bottom:16px}
.fgroup h3{
  font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  margin:0 0 6px;display:flex;align-items:center;gap:6px;
}
.fgroup h3 .clr{
  margin-left:auto;font-size:10.5px;text-transform:none;letter-spacing:0;
  color:var(--accent);cursor:pointer;border:0;background:none;padding:2px 4px;display:none;
}
.fgroup.active h3 .clr{display:inline}
.opt{
  display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px;
  cursor:pointer;font-size:13px;line-height:1.35;
}
.opt:hover{background:var(--plane)}
.opt.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.opt input{margin:0;accent-color:var(--accent);flex:0 0 auto;width:15px;height:15px}
.opt .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .n{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.swatch{width:9px;height:9px;border-radius:2.5px;flex:0 0 auto}
.more{border:0;background:none;color:var(--accent);font-size:12px;cursor:pointer;padding:5px 6px}
.ffilter{
  width:100%;padding:6px 8px;margin-bottom:6px;border-radius:7px;
  border:1px solid var(--ring);background:var(--plane);font-size:12.5px;
}

#scroll{flex:1;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch}
#pad{position:relative;width:100%}
.row{
  position:absolute;left:0;right:0;padding:13px 20px;overflow:hidden;
  border-bottom:1px solid var(--grid);background:var(--surface-1);
  display:flex;gap:12px;
}
.row:hover{background:var(--raised)}
.bar{width:3px;border-radius:2px;flex:0 0 auto;background:var(--axis)}
.body{flex:1;min-width:0}
.t{font-weight:590;font-size:14.5px;letter-spacing:-.005em;margin-bottom:3px}
.t a{color:var(--ink);text-decoration:none}
.t a:hover{color:var(--accent);text-decoration:underline}
.sm{color:var(--ink-2);font-size:13.2px;margin:0 0 6px;cursor:pointer;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.open .sm{-webkit-line-clamp:unset;display:block}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px}
.chip{padding:2px 7px;border-radius:999px;border:1px solid var(--ring);color:var(--ink-2);white-space:nowrap}
.chip.co{border-color:color-mix(in srgb,var(--accent) 40%,var(--ring));color:var(--accent);cursor:pointer}
.chip.ed{border:0;color:#fff;font-weight:520}
.chip.sp{border-color:var(--s2);color:var(--s2)}
.dt{color:var(--muted);font-variant-numeric:tabular-nums}
.dot{color:var(--axis)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
mark{background:color-mix(in srgb,var(--s4) 45%,transparent);color:inherit;border-radius:2px}

.boot{display:flex;height:100dvh;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted);padding:24px;text-align:center}
.bar-track{width:180px;height:3px;border-radius:2px;background:var(--grid);overflow:hidden}
.bar-fill{height:100%;width:35%;background:var(--accent);border-radius:2px;animation:sl 1.1s ease-in-out infinite}
@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(390%)}}

#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:19;opacity:0;pointer-events:none;transition:opacity .18s}
body.filters-open #scrim{opacity:1;pointer-events:auto}

@media (max-width:860px){
  header{padding-left:14px;padding-right:14px}
  .hrow{flex-wrap:nowrap;gap:8px}
  .iconbtn{padding:6px 9px;font-size:12px}
  h1{overflow:hidden;text-overflow:ellipsis}
  .searchbar{padding:9px 14px}
  .row{padding:13px 14px}
  h1{font-size:16px}
  #hsub{display:none}
  #spark{display:none}
  .tiles{gap:16px;margin-top:9px}
  .tile .v{font-size:17px}
  aside{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;flex:none;
    max-height:78dvh;z-index:20;border-right:0;border-top:1px solid var(--grid);
    border-radius:16px 16px 0 0;box-shadow:0 -8px 40px var(--shadow);
    transform:translateY(101%);transition:transform .22s cubic-bezier(.32,.72,0,1);
    padding-top:8px;
  }
  body.filters-open aside{transform:none}
  aside::before{
    content:"";display:block;flex:0 0 auto;width:38px;height:4px;border-radius:2px;
    background:var(--axis);margin:2px auto 10px;
  }
  #facetlist{padding-top:0}
  .opt{padding:8px 6px;font-size:13.5px}
  .fsheet-done{
    flex:0 0 auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:var(--surface-1);border-top:1px solid var(--grid);
  }
  .fsheet-done button{
    width:100%;padding:11px;border-radius:10px;border:0;background:var(--accent);
    color:#fff;font-weight:600;font-size:14px;cursor:pointer;
  }
}
@media (max-width:560px){ #csv{display:none} .tiles .tile:nth-child(4){display:none} }
@media (min-width:861px){ .fsheet-done{display:none} #scrim{display:none} }
</style>
</head>
<body>
<div id="boot" class="boot">
  <div id="bootmsg">Loading archive…</div>
  <div class="bar-track"><div class="bar-fill"></div></div>
</div>
<div id="scrim"></div>
<div class="app" id="app" hidden>

  <header>
    <div class="hrow">
      <h1 id="htitle">Newsletter Archive</h1>
      <span class="sub" id="hsub"></span>
      <span class="spacer"></span>
      <button class="iconbtn" id="mfilters">Filters<span class="badge" id="fbadge" hidden>0</span></button>
      <button class="iconbtn" id="csv">CSV</button>
      <button class="iconbtn" id="theme">Dark</button>
    </div>
    <div class="tiles">
      <div class="tile"><div class="v" id="t-items">—</div><div class="k">items</div></div>
      <div class="tile"><div class="v" id="t-mails">—</div><div class="k">issues</div></div>
      <div class="tile"><div class="v" id="t-srcs">—</div><div class="k">newsletters</div></div>
      <div class="tile"><div class="v" id="t-cos">—</div><div class="k">companies</div></div>
      <div class="tile"><div class="v" id="t-span">—</div><div class="k">covered</div></div>
      <div id="spark"></div>
    </div>
  </header>

  <div class="searchbar">
    <input id="q" type="search" placeholder="Search…" autocomplete="off" enterkeyhint="search">
    <select id="sort">
      <option value="new">Newest</option>
      <option value="old">Oldest</option>
      <option value="short">Shortest read</option>
      <option value="long">Longest read</option>
      <option value="money">Biggest $</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <main>
    <aside id="asidebox"><div id="facetlist"></div><div class="fsheet-done" id="fdone"></div></aside>
    <section class="results"><div id="scroll"><div id="pad"></div></div></section>
  </main>
</div>

<script>
const BUILD = {"mode": "fetch", "url": "data.json"};
const META  = {"built": "2026-08-22", "items": 16428, "emails": 1054, "sources": ["TLDR"], "from": "2024-12-30", "to": "2026-08-12"};

function b64ToBytes(b64){
  const bin = atob(b64); const out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
async function gunzip(bytes){
  if (typeof DecompressionStream !== 'function')
    throw new Error('This browser lacks DecompressionStream. Try Chrome, Edge, Firefox, or Safari 16.4+.');
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function loadData(){
  if (BUILD.mode === 'inline'){
    document.getElementById('bootmsg').textContent = 'Decompressing archive…';
    return JSON.parse(new TextDecoder().decode(await gunzip(b64ToBytes(BUILD.payload))));
  }
  document.getElementById('bootmsg').textContent = 'Fetching archive…';
  // Prefer the pre-gzipped payload so this stays cheap on cellular.
  if (typeof DecompressionStream === 'function'){
    try{
      const gz = await fetch(BUILD.url + '.gz', {cache:'default'});
      if (gz.ok){
        const buf = new Uint8Array(await gz.arrayBuffer());
        const isGzip = buf[0] === 0x1f && buf[1] === 0x8b;
        return JSON.parse(new TextDecoder().decode(isGzip ? await gunzip(buf) : buf));
      }
    }catch(e){ /* fall through */ }
  }
  const res = await fetch(BUILD.url, {cache:'default'});
  if (!res.ok) throw new Error(`Could not load ${BUILD.url} (HTTP ${res.status}).`);
  return res.json();
}

let DATA, ITEMS=[], DATES, SOURCES, EDITIONS, SECTIONS, CATS, COMPS, TECHS, SRCS, RTS, AUTHORS;
const D=0,SO=1,E=2,S=3,T=4,SUM=5,U=6,SRC=7,RT=8,MIN=9,SP=10,CO=11,TE=12,CAT=13,XP=14,AMT=15,AU=16,RES=17;
const BLOB=18, YR=19;

const state = {
  q:'', sort:'new',
  so:new Set(), ed:new Set(), cat:new Set(), co:new Set(), tech:new Set(), src:new Set(), yr:new Set(),
  sponsor:'all'
};
let filtered=[];
const EDCOLORS=['var(--s1)','var(--s3)','var(--s7)','var(--s2)','var(--s5)','var(--s6)','var(--s4)','var(--s8)'];
let srcColor={};

(async function boot(){
  try{ DATA = await loadData(); }
  catch(err){
    document.getElementById('boot').innerHTML =
      `<div style="max-width:32em"><strong>Couldn't load the archive.</strong><br><br>${
        String(err.message).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div>`;
    return;
  }
  ({dates:DATES, sources:SOURCES, editions:EDITIONS, sections:SECTIONS, cats:CATS,
    comps:COMPS, techs:TECHS, srcs:SRCS, rts:RTS, authors:AUTHORS} = DATA);
  ITEMS = DATA.rows;
  for (const r of ITEMS){
    r[BLOB] = (r[T]+' '+r[SUM]).toLowerCase();
    r[YR]   = DATES[r[D]].slice(0,4);
  }
  SOURCES.forEach((s,i)=> srcColor[i]=EDCOLORS[i]||'var(--axis)');
  document.getElementById('boot').remove();
  document.getElementById('app').hidden=false;
  buildStatics(); wire(); restoreFromHash(); apply();
})();

const fmt = n => n.toLocaleString('en-US');

function buildStatics(){
  const cos=new Set(); for(const r of ITEMS) for(const c of r[CO]) cos.add(c);
  document.getElementById('t-items').textContent = fmt(ITEMS.length);
  document.getElementById('t-mails').textContent = fmt(META.emails);
  document.getElementById('t-srcs').textContent  = SOURCES.length;
  document.getElementById('t-cos').textContent   = fmt(cos.size);
  const d0=DATES[0], d1=DATES[DATES.length-1];
  document.getElementById('t-span').textContent =
    Math.round((new Date(d1)-new Date(d0))/(864e5*30.44))+' mo';
  document.getElementById('hsub').textContent =
    `${d0} → ${d1} · ${SOURCES.join(' · ')} · updated ${META.built}`;
  drawSpark();
}

function drawSpark(){
  const by=new Map();
  for(const r of ITEMS){ const k=DATES[r[D]].slice(0,7); by.set(k,(by.get(k)||0)+1); }
  const keys=[...by.keys()].sort(), vals=keys.map(k=>by.get(k));
  const max=Math.max(...vals), W=keys.length*9-3, H=32;
  const bars=keys.map((k,i)=>{
    const h=Math.max(2,Math.round(vals[i]/max*H));
    return `<rect x="${i*9}" y="${H-h}" width="6" height="${h}" rx="2" fill="var(--seq-4)"><title>${k}: ${fmt(vals[i])} items</title></rect>`;
  }).join('');
  document.getElementById('spark').innerHTML =
    `<svg width="${W}" height="${H+14}" role="img" aria-label="Items per month">${bars}
     <text x="0" y="${H+12}" font-size="10" fill="var(--muted)">${keys[0]}</text>
     <text x="${W}" y="${H+12}" font-size="10" fill="var(--muted)" text-anchor="end">${keys[keys.length-1]}</text></svg>`;
}

const FACETS=[
  {key:'so',   title:'Newsletter',        dict:()=>SOURCES,  get:r=>[r[SO]], color:true},
  {key:'ed',   title:'Edition',           dict:()=>EDITIONS, get:r=>[r[E]]},
  {key:'cat',  title:'Type of news',      dict:()=>CATS,     get:r=>[r[CAT]]},
  {key:'co',   title:'Company / product', dict:()=>COMPS,    get:r=>r[CO], search:true, limit:12},
  {key:'tech', title:'Technology',        dict:()=>TECHS,    get:r=>r[TE], limit:8},
  {key:'src',  title:'Linked source',     dict:()=>SRCS,     get:r=>r[SRC]<0?[]:[r[SRC]], search:true, limit:10},
  {key:'yr',   title:'Year',              dict:null,         get:r=>[r[YR]]},
];

function matchesExcept(r, skip){
  if (state.q) for (const t of state.q) if (!r[BLOB].includes(t)) return false;
  if (state.sponsor==='hide' && r[SP]) return false;
  if (state.sponsor==='only' && !r[SP]) return false;
  for (const f of FACETS){
    if (f.key===skip) continue;
    const sel=state[f.key]; if(!sel.size) continue;
    let hit=false;
    for (const v of f.get(r)) if (sel.has(v)){hit=true;break;}
    if(!hit) return false;
  }
  return true;
}
function facetCounts(f){
  const m=new Map();
  for(const r of ITEMS){ if(!matchesExcept(r,f.key)) continue;
    for(const v of f.get(r)) m.set(v,(m.get(v)||0)+1); }
  return m;
}

const expanded={}, ffilters={};
function activeCount(){ return FACETS.reduce((n,f)=>n+state[f.key].size,0) + (state.sponsor!=='all'?1:0); }

function renderFacets(){
  const host=document.getElementById('facetlist');
  const frag=document.createDocumentFragment();

  const sp=document.createElement('div');
  sp.className='fgroup'+(state.sponsor!=='all'?' active':'');
  sp.innerHTML=`<h3>Sponsored content<button class="clr">reset</button></h3>
   <div class="opt${state.sponsor==='all'?' on':''}" data-sp="all"><input type="radio" name="sp" ${state.sponsor==='all'?'checked':''}><span class="lbl">Include</span></div>
   <div class="opt${state.sponsor==='hide'?' on':''}" data-sp="hide"><input type="radio" name="sp" ${state.sponsor==='hide'?'checked':''}><span class="lbl">Hide ads</span></div>
   <div class="opt${state.sponsor==='only'?' on':''}" data-sp="only"><input type="radio" name="sp" ${state.sponsor==='only'?'checked':''}><span class="lbl">Only ads</span></div>`;
  sp.querySelector('.clr').onclick=e=>{e.stopPropagation();state.sponsor='all';apply();};
  sp.querySelectorAll('[data-sp]').forEach(el=>el.onclick=()=>{state.sponsor=el.dataset.sp;apply();});
  frag.appendChild(sp);

  for(const f of FACETS){
    const counts=facetCounts(f), dict=f.dict?f.dict():null;
    let entries=[...counts.entries()].map(([v,n])=>({v,n,label:dict?dict[v]:String(v)})).filter(e=>e.n>0);
    if(f.key==='yr') entries.sort((a,b)=>b.label.localeCompare(a.label));
    else entries.sort((a,b)=>b.n-a.n||a.label.localeCompare(b.label));
    const q=(ffilters[f.key]||'').toLowerCase();
    if(q) entries=entries.filter(e=>e.label.toLowerCase().includes(q));

    const sel=state[f.key];
    const limit=expanded[f.key]?1e9:(f.limit||1e9);
    const shown=entries.slice(0,limit);
    for(const e of entries) if(sel.has(e.v)&&!shown.includes(e)) shown.push(e);

    const g=document.createElement('div');
    g.className='fgroup'+(sel.size?' active':''); g.dataset.fkey=f.key;
    const h=document.createElement('h3');
    h.innerHTML=`${f.title}<button class="clr">clear</button>`;
    h.querySelector('.clr').onclick=ev=>{ev.stopPropagation();sel.clear();apply();};
    g.appendChild(h);

    if(f.search){
      const inp=document.createElement('input');
      inp.className='ffilter'; inp.type='search'; inp.placeholder='Filter…';
      inp.value=ffilters[f.key]||'';
      inp.oninput=()=>{ ffilters[f.key]=inp.value; renderFacets();
        const n=document.querySelector(`[data-fkey="${f.key}"] .ffilter`);
        if(n){n.focus();n.setSelectionRange(inp.value.length,inp.value.length);} };
      g.appendChild(inp);
    }
    for(const e of shown){
      const o=document.createElement('div');
      o.className='opt'+(sel.has(e.v)?' on':'');
      const sw=f.color?`<span class="swatch" style="background:${srcColor[e.v]}"></span>`:'';
      o.innerHTML=`<input type="checkbox" ${sel.has(e.v)?'checked':''}>${sw}<span class="lbl" title="${esc(e.label)}">${esc(e.label)}</span><span class="n">${fmt(e.n)}</span>`;
      o.onclick=()=>{ sel.has(e.v)?sel.delete(e.v):sel.add(e.v); apply(); };
      g.appendChild(o);
    }
    if(entries.length>shown.length||expanded[f.key]){
      const b=document.createElement('button'); b.className='more';
      b.textContent=expanded[f.key]?'Show less':`Show all ${fmt(entries.length)}`;
      b.onclick=()=>{expanded[f.key]=!expanded[f.key];renderFacets();};
      g.appendChild(b);
    }
    if(!shown.length){
      const n=document.createElement('div'); n.className='sub'; n.style.padding='2px 6px';
      n.textContent='no matches'; g.appendChild(n);
    }
    frag.appendChild(g);
  }

  host.replaceChildren(frag);
  const done=document.getElementById('fdone');
  done.innerHTML=`<button>Show ${fmt(filtered.length)} results</button>`;
  done.querySelector('button').onclick=()=>document.body.classList.remove('filters-open');
  const badge=document.getElementById('fbadge'), n=activeCount();
  badge.hidden = n===0; badge.textContent = n;
}

function apply(){
  filtered = ITEMS.filter(r=>matchesExcept(r,null));
  const s=state.sort;
  if(s==='new') filtered.sort((a,b)=>b[D]-a[D]||a[E]-b[E]);
  else if(s==='old') filtered.sort((a,b)=>a[D]-b[D]||a[E]-b[E]);
  else if(s==='short') filtered.sort((a,b)=>(a[MIN]<0?1e9:a[MIN])-(b[MIN]<0?1e9:b[MIN]));
  else if(s==='long') filtered.sort((a,b)=>(b[MIN]<0?-1:b[MIN])-(a[MIN]<0?-1:a[MIN]));
  else if(s==='money') filtered.sort((a,b)=>b[AMT]-a[AMT]||b[D]-a[D]);
  document.getElementById('count').textContent=`${fmt(filtered.length)} / ${fmt(ITEMS.length)}`;
  renderFacets(); saveToHash(); resetList();
}

const scroll=document.getElementById('scroll'), pad=document.getElementById('pad');
let poolEls=[], openSet=new Set(), offsets=new Float64Array(1), contentW=800;

const PAD_Y=26, TITLE_LH=20, SUM_LH=19.6, GAP_SUM=6, META_LH=16.5, META_GAP=5, BORDER=1;
function measureWidth(){
  const b=pad.querySelector('.row .body');
  contentW = (b&&b.clientWidth) || Math.max(240, scroll.clientWidth - (innerWidth<=860?28:40) - 15);
}
const CPL_T = w=>Math.max(12,Math.floor(w/7.55));
const CPL_S = w=>Math.max(12,Math.floor(w/6.55));

function chipLines(r,w){
  const edl=(EDITIONS[r[E]]===SOURCES[r[SO]]?SOURCES[r[SO]]:SOURCES[r[SO]]+' · '+EDITIONS[r[E]]).length;
  const wd=[edl*6.6+16, CATS[r[CAT]].length*6.6+16];
  if(r[SP]&&CATS[r[CAT]]!=='Sponsored') wd.push(9*6.6+16);
  for(const c of r[CO].slice(0,4)) wd.push(COMPS[c].length*6.6+16);
  for(const x of r[TE].slice(0,3)) wd.push(TECHS[x].length*6.6+16);
  let lines=1,used=0;
  for(const cw of wd){ if(used&&used+cw+6>w){lines++;used=cw;} else used+=cw+6; }
  return lines;
}
function metaLines(r,w){
  let s=DATES[r[D]].length+(SECTIONS[r[S]]||'').length+6;
  if(r[AU]>=0) s+=AUTHORS[r[AU]].length+3;
  if(r[RT]>=0) s+=RTS[r[RT]].length+3;
  if(r[SRC]>=0) s+=SRCS[r[SRC]].length+3;
  if(r[XP]) s+=25;
  return Math.max(1,Math.ceil(s*6.2/w));
}
function rowHeight(i){
  const r=filtered[i], w=contentW;
  const tL=Math.max(1,Math.ceil(r[T].length/CPL_T(w)));
  const sF=Math.max(1,Math.ceil(r[SUM].length/CPL_S(w)));
  const sL=r[SUM]?(openSet.has(i)?sF:Math.min(2,sF)):0;
  return Math.round(PAD_Y+tL*TITLE_LH+3+sL*SUM_LH+(sL?GAP_SUM:2)
    +metaLines(r,w)*META_LH+META_GAP+chipLines(r,w)*(META_LH+4)+BORDER);
}
function buildOffsets(){
  offsets=new Float64Array(filtered.length+1);
  for(let i=0;i<filtered.length;i++) offsets[i+1]=offsets[i]+rowHeight(i);
}
function findFirst(y){
  let lo=0,hi=filtered.length;
  while(lo<hi){const m=(lo+hi)>>1; if(offsets[m+1]<=y) lo=m+1; else hi=m;}
  return lo;
}
function resetList(){ scroll.scrollTop=0; openSet.clear(); measureWidth(); buildOffsets(); draw._checked=false; draw(); }

function draw(){
  if(!filtered.length){
    pad.replaceChildren(Object.assign(document.createElement('div'),
      {className:'empty',textContent:'No items match these filters.'}));
    pad.style.height='auto'; poolEls=[]; return;
  }
  if(offsets.length!==filtered.length+1) buildOffsets();
  pad.style.height=offsets[filtered.length]+'px';
  const top=scroll.scrollTop,h=scroll.clientHeight;
  const first=Math.max(0,findFirst(top)-2);
  let last=first; while(last<filtered.length && offsets[last]<top+h+400) last++;
  const need=last-first;
  while(poolEls.length<need){ const d=document.createElement('div'); d.className='row'; pad.appendChild(d); poolEls.push(d); }
  for(let i=need;i<poolEls.length;i++) poolEls[i].style.display='none';
  for(let i=0;i<need;i++){
    const el=poolEls[i], idx=first+i, r=filtered[idx];
    el.style.display='flex'; el.style.top=offsets[idx]+'px';
    el.style.height=(offsets[idx+1]-offsets[idx])+'px';
    el.className='row'+(openSet.has(idx)?' open':'');
    el.innerHTML=rowHTML(r);
    const sm=el.querySelector('.sm');
    if(sm) sm.onclick=()=>{ openSet.has(idx)?openSet.delete(idx):openSet.add(idx); buildOffsets(); draw(); };
    el.querySelectorAll('.chip.co').forEach(c=>{
      c.onclick=ev=>{ ev.preventDefault(); ev.stopPropagation();
        const v=COMPS.indexOf(c.dataset.co); if(v>=0){state.co.add(v);apply();} };
    });
  }
  if(!draw._checked && poolEls.length){
    draw._checked=true;
    requestAnimationFrame(()=>{ measureWidth(); buildOffsets(); draw(); });
  }
}
scroll.addEventListener('scroll',()=>requestAnimationFrame(draw),{passive:true});
let rzT; addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{measureWidth();buildOffsets();draw();},120);});

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hl(s){
  let o=esc(s);
  if(state.q) for(const t of state.q){
    if(t.length<2) continue;
    o=o.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
  }
  return o;
}
function rowHTML(r){
  const label = EDITIONS[r[E]]===SOURCES[r[SO]] ? SOURCES[r[SO]] : `${SOURCES[r[SO]]} · ${EDITIONS[r[E]]}`;
  const chips=[`<span class="chip ed" style="background:${srcColor[r[SO]]}">${esc(label)}</span>`,
               `<span class="chip">${esc(CATS[r[CAT]])}</span>`];
  if(r[SP]&&CATS[r[CAT]]!=='Sponsored') chips.push('<span class="chip sp">sponsored</span>');
  for(const c of r[CO].slice(0,4)) chips.push(`<span class="chip co" data-co="${esc(COMPS[c])}">${esc(COMPS[c])}</span>`);
  for(const t of r[TE].slice(0,3)) chips.push(`<span class="chip">${esc(TECHS[t])}</span>`);

  const sect=SECTIONS[r[S]]||'', rt=r[RT]>=0?RTS[r[RT]]:'', src=r[SRC]>=0?SRCS[r[SRC]]:'';
  const au=r[AU]>=0?AUTHORS[r[AU]]:'';
  const title = (r[U] && r[RES])
      ? `<a href="${esc(r[U])}" target="_blank" rel="noopener">${hl(r[T])}</a>`
      : hl(r[T]);
  return `<div class="bar" style="background:${srcColor[r[SO]]}"></div>
  <div class="body">
    <div class="t">${title}</div>
    ${r[SUM]?`<p class="sm">${hl(r[SUM])}</p>`:''}
    <div class="meta">
      <span class="dt">${DATES[r[D]]}</span>
      ${au?`<span class="dot">·</span><span class="dt">${esc(au)}</span>`:''}
      ${sect?`<span class="dot">·</span><span class="dt">${esc(sect)}</span>`:''}
      ${rt?`<span class="dot">·</span><span class="dt">${esc(rt)}</span>`:''}
      ${src?`<span class="dot">·</span><span class="dt">${esc(src)}</span>`:''}
      ${r[XP]?`<span class="dot">·</span><span class="dt">also elsewhere</span>`:''}
    </div>
    <div class="meta" style="margin-top:5px">${chips.join('')}</div>
  </div>`;
}

function saveToHash(){
  const p=new URLSearchParams();
  if(state.q) p.set('q',state.q.join(' '));
  for(const f of FACETS) if(state[f.key].size) p.set(f.key,[...state[f.key]].join(','));
  if(state.sponsor!=='all') p.set('sp',state.sponsor);
  if(state.sort!=='new') p.set('sort',state.sort);
  const h=p.toString();
  history.replaceState(null,'',h?'#'+h:location.pathname);
}
function restoreFromHash(){
  const p=new URLSearchParams(location.hash.slice(1));
  const q=p.get('q'); if(q){ state.q=q.toLowerCase().split(/\s+/); document.getElementById('q').value=q; }
  for(const f of FACETS){
    const v=p.get(f.key); if(!v) continue;
    for(const x of v.split(',')) state[f.key].add(f.key==='yr'?x:Number(x));
  }
  const sp=p.get('sp'); if(sp) state.sponsor=sp;
  const so=p.get('sort'); if(so){ state.sort=so; document.getElementById('sort').value=so; }
}

function wire(){
  let t;
  document.getElementById('q').addEventListener('input',e=>{
    clearTimeout(t);
    t=setTimeout(()=>{ const v=e.target.value.trim().toLowerCase();
      state.q=v?v.split(/\s+/):''; apply(); },160);
  });
  document.getElementById('sort').onchange=e=>{state.sort=e.target.value;apply();};

  const tb=document.getElementById('theme');
  const setTheme=m=>{ document.documentElement.dataset.theme=m; tb.textContent=m==='dark'?'Light':'Dark';
    try{localStorage.setItem('na-theme',m)}catch(e){} };
  let saved=null; try{saved=localStorage.getItem('na-theme')}catch(e){}
  setTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
  tb.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

  document.getElementById('mfilters').onclick=()=>document.body.classList.toggle('filters-open');
  document.getElementById('scrim').onclick=()=>document.body.classList.remove('filters-open');
  addEventListener('keydown',e=>{
    if(e.key==='Escape') document.body.classList.remove('filters-open');
    if(e.key==='/' && document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('q').focus();}
  });
  document.getElementById('csv').onclick=exportCSV;
}

function exportCSV(){
  const head=['date','newsletter','edition','section','category','title','author','summary','read_time','companies','tech','linked_source','url','sponsored'];
  const qq=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const lines=[head.join(',')];
  for(const r of filtered) lines.push([
    DATES[r[D]],SOURCES[r[SO]],EDITIONS[r[E]],SECTIONS[r[S]]||'',CATS[r[CAT]],r[T],
    r[AU]>=0?AUTHORS[r[AU]]:'',r[SUM],r[RT]>=0?RTS[r[RT]]:'',
    r[CO].map(c=>COMPS[c]).join('; '),r[TE].map(x=>TECHS[x]).join('; '),
    r[SRC]>=0?SRCS[r[SRC]]:'',r[RES]?r[U]:'',r[SP]?'yes':'no'
  ].map(qq).join(','));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}));
  a.download=`newsletter-archive-${filtered.length}-items.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}
</script>
